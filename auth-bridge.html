<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Secret File — Secure Browser Authentication</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #3b82f6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #2563eb; }
    .status {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #38bdf8;
      font-weight: 500;
    }
    .success-badge {
      display: none;
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
      padding: 0.75rem;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>Medical Secret File Desktop Login</h1>
    <p>Sign in with your Google account to synchronize your exam attempts, leaderboard rank, and history with your desktop app.</p>
    
    <button id="loginBtn" class="btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
      </svg>
      Sign In with Google
    </button>

    <div id="status" class="status">Waiting for sign in...</div>
    <div id="successBadge" class="success-badge">✓ Successfully signed in! Returning to Medical Secret File...</div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js';

    // Fetch firebase config or fallback
    let config = {
      projectId: "hazera-taju-degree-college",
      authDomain: "hazera-taju-degree-college.firebaseapp.com",
      storageBucket: "hazera-taju-degree-college.firebasestorage.app"
    };

    try {
      const res = await fetch('./firebase-applet-config.json');
      if (res.ok) {
        config = await res.json();
      }
    } catch (e) {}

    const app = initializeApp(config);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('loginBtn');
    const statusDiv = document.getElementById('status');
    const successBadge = document.getElementById('successBadge');

    const urlParams = new URLSearchParams(window.location.search);
    const callbackPort = urlParams.get('port') || '54321';

    async function handleLogin() {
      loginBtn.disabled = true;
      statusDiv.textContent = 'Opening Google authentication window...';
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const idToken = await user.getIdToken();

        statusDiv.textContent = 'Account verified! Connecting back to desktop app...';
        successBadge.style.display = 'block';
        loginBtn.style.display = 'none';

        const userPayload = encodeURIComponent(JSON.stringify({
          uid: user.uid,
          displayName: user.displayName || 'Medical Candidate',
          email: user.email || '',
          photoURL: user.photoURL || ''
        }));

        // Redirect back to the local Electron callback server
        setTimeout(() => {
          window.location.href = `http://localhost:${callbackPort}/callback?user=${userPayload}&token=${encodeURIComponent(idToken)}`;
        }, 600);

      } catch (err) {
        console.error(err);
        loginBtn.disabled = false;
        statusDiv.textContent = 'Sign-in error: ' + (err.message || 'Please try again.');
        statusDiv.style.color = '#ef4444';
      }
    }

    loginBtn.addEventListener('click', handleLogin);
    
    // Auto trigger popup on load
    setTimeout(() => {
      handleLogin();
    }, 500);
  </script>
</body>
</html>
