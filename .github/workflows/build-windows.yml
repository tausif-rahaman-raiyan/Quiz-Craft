name: Build Windows Offline Executable (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Medical Secret File Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & platform bindings
        run: |
          npm install --include=optional
          npm install --no-save @rollup/rollup-win32-x64-msvc

      - name: Ensure Application Icons Exist
        run: node scripts/generate-icons.cjs

      - name: Build web application
        run: npm run build

      - name: Build Windows Installer (.exe Setup)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medical-Secret-File-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          name: Medical Secret File ${{ github.ref_name }}
          body: |
            ### 🏥 Medical Secret File — 100% Offline Windows Application
            
            **Available Download:**
            - **Installer (`Medical Secret File Setup.exe`)**: Windows setup installer with custom drive/directory selection (install to C:, D:, E:, etc.), automatic desktop & start menu shortcuts, and seamless in-place updates.
            
            **Key Highlights:**
            - 100% Offline: 114 exam sets with 11,400+ MCQs preloaded.
            - Built-in App Icon & branding embedded in installer and shortcuts.
            - Realtime Global Leaderboard & Google authentication sync.
            - Negative marking (-0.25) & Continuous Question Sheet.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
