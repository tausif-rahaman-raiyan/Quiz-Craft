<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cross-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="cross-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="#4338ca" stroke-width="8" filter="url(#glow)"/>

  <!-- Inner shield / emblem border -->
  <rect x="52" y="52" width="408" height="408" rx="88" fill="none" stroke="url(#badge-grad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Medical Cross Shadow / Glow -->
  <g filter="url(#glow)">
    <!-- Red medical base cross -->
    <path d="M 216 112 H 296 V 216 H 400 V 296 H 296 V 400 H 216 V 296 H 112 V 216 H 216 Z" fill="url(#cross-grad)" rx="16" />
  </g>

  <!-- Medical Cross Inner Accent -->
  <path d="M 228 124 H 284 V 228 H 388 V 284 H 284 V 388 H 228 V 284 H 124 V 228 H 228 Z" fill="#ffffff" fill-opacity="0.95" />

  <!-- Center Stethoscope / Secret File Shield Emblem -->
  <circle cx="256" cy="256" r="54" fill="#1e1b4b" stroke="#38bdf8" stroke-width="6"/>

  <!-- Pulse / Heartbeat Line in center -->
  <path d="M 218 256 L 236 256 L 244 240 L 254 274 L 264 246 L 270 256 L 294 256" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top "MEDICAL" subtle banner -->
  <text x="256" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle" letter-spacing="6">MEDICAL</text>

  <!-- Bottom "SECRET FILE" badge -->
  <rect x="136" y="416" width="240" height="38" rx="19" fill="#0284c7" fill-opacity="0.9"/>
  <text x="256" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">SECRET FILE</text>
</svg>
